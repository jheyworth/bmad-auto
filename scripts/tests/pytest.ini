[pytest]
markers =
    e2e: end-to-end test that drives a real claude session via tmux (opt-in)
    e2e_fast: e2e subset that's cheap enough for per-push CI (T2, T3)
    e2e_slow: e2e subset that's expensive — nightly CI only (T1, T4)

# By default, skip the e2e markers entirely. They opt in via:
#   pytest -m e2e          (all e2e)
#   pytest -m e2e_fast     (per-push CI)
#   pytest -m e2e_slow     (nightly CI)
addopts = -m "not e2e"
